<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate generator</title>
    <link rel="stylesheet" href="cert.css">
</head>
<body>
    <div class="newcert">Buat sertifikat</div>
    <div class="page page12">
        <div class="cert">
            <img class="cert-bg" src="cert_bg.png" alt="">
            <h1 class="student-name"></h1>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>

    <script>
let student_name
function getName() {
    student_name = prompt("Nama siswa")
    document.querySelector('.student-name').innerHTML = student_name
}

document.querySelector('.newcert').addEventListener('click', getName )

let cert = document.querySelector('.page12 .cert')
cert.style.transform = `scale(${getScale()})`

function getScale() {
	let certStyles = getComputedStyle(document.querySelector('.cert'))
	let toScale = 0.9 * window.innerHeight / parseInt(certStyles.height)
	return toScale
}

function download_cert() {
    document.querySelector('.cert').style.transform = `none`
    domtoimage.toPng(document.querySelector('.cert'), {quality: 1})
    .then(function (dataUrl) {
        var img = new Image()
        img.src = dataUrl
        let link = document.createElement('a')
        link.download = `${student_name} - Sertifikat Pahlawan Anggaran.png`
        link.href = dataUrl
        link.click()
        document.querySelector('.cert').style.transform = `scale(${getScale()})`
    })
    .catch(function (error) {
        console.error('oops, something went wrong!', error);
    })
}

document.querySelector('.cert').addEventListener('click', download_cert)

</script>
</body>
</html>

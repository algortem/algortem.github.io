<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate generator</title>
    <link rel="stylesheet" href="cert.css">
</head>
<body>
    <div class="newcert">Lisensi baru</div>
    <div class="editteacher">Ubah nama guru</div>
    <div class="page page12">
        <div class="cert">
            <img class="cert-bg" src="cert_bg.png" alt="">
            <h1 class="student-name"></h1>
            <div class="footer">
                <div class="teacher-name-group">
                    <div class="mentor">Mentor:&nbsp;</div>
                    <div class="name"></div>
                </div>
                <div class="year">2025</div>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
<script>
function getCookieValue(name) {
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}

let teacher_name

if (document.cookie.includes("math_teacher_name=")) {
    teacher_name = getCookieValue('math_teacher_name')
} else {
    teacher_name = prompt("Siapa nama Anda? (nama guru)")
    document.cookie = `math_teacher_name=${teacher_name}; max-age=86400; path=/`;
}

document.querySelector('.name').innerHTML = teacher_name




document.querySelector('.editteacher').addEventListener('click', function() {
    teacher_name = prompt("Siapa nama Anda? (nama guru)")
    document.cookie = `math_teacher_name=${teacher_name}; max-age=86400; path=/`;
    document.querySelector('.name').innerHTML = teacher_name
})
</script>
    <script>
let student_name
function getName() {
    student_name = prompt("Nama siswa")
    document.querySelector('.student-name').innerHTML = student_name
}

document.querySelector('.newcert').addEventListener('click', getName )

let cert = document.querySelector('.page12 .cert')
cert.style.transform = `scale(${getScale()})`

function getScale() {
	let certStyles = getComputedStyle(document.querySelector('.cert'))
	let toScale = 0.9 * window.innerHeight / parseInt(certStyles.height)
	return toScale
}

function download_cert() {
    document.querySelector('.cert').style.transform = `none`
    domtoimage.toPng(document.querySelector('.cert'), {quality: 1})
    .then(function (dataUrl) {
        var img = new Image()
        img.src = dataUrl
        let link = document.createElement('a')
        link.download = `${student_name} - Sertifikat Pahlawan Anggaran.png`
        link.href = dataUrl
        link.click()
        document.querySelector('.cert').style.transform = `scale(${getScale()})`
    })
    .catch(function (error) {
        console.error('oops, something went wrong!', error);
    })
}

document.querySelector('.cert').addEventListener('click', download_cert)

</script>
</body>
</html>

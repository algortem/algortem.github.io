<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ProTeam HR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f0f2f5;
  --app:#ffffff;
  --primary:#7c3aed;
  --accent:#f7f5ff;
  --text:#1c1c1c;
  --muted:#555;
  --shadow:0 6px 18px rgba(0,0,0,0.08);
}

*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif;margin:0;padding:0;}

body{
  height:100vh;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
}

button, .burger{
  cursor:pointer;
}

.app{
  height:95vh;
  aspect-ratio:430/932;
  background:var(--app);
  border-radius:30px;
  box-shadow:0 25px 60px rgba(0,0,0,.15);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}

.header{
  padding:18px;
  text-align:center;
  border-bottom:1px solid #ddd;
  position:relative;
  font-weight:600;
  color:var(--text);
}

.burger{
  position:absolute;
  left:16px;
  top:16px;
  font-size:22px;
  color:var(--text);
}

.menu{
  display:none;
  flex-direction:column;
  background:#f7f5ff;
  border-bottom:1px solid #ddd;
}

.menu button{
  padding:14px 20px;
  background:none;
  border:none;
  text-align:left;
  font-size:15px;
  color:var(--text);
}

.pages{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.page{display:none;}
.page.active{display:block;}

/* CARD */
.card{
  background:linear-gradient(145deg,#f5f2ff,#f0eaff);
  border-radius:22px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:14px;
  opacity:0;
  transform:translateY(10px);
  transition:all 0.4s ease;
}
.card.show{opacity:1;transform:translateY(0);}

/* FORM ELEMENTS */
input, select, textarea{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:none;
  background:var(--accent);
  font-size:14px;
  color:var(--text);
}

textarea{resize:none}

.primary{
  background:var(--primary);
  color:white;
  border:none;
  height:44px;
  border-radius:18px;
  width:100%;
  font-weight:600;
  margin-top:16px;
}

.row{
  display:flex;
  gap:12px;
}

.table-row{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid rgba(0,0,0,0.05);
}

.big{
  font-size:32px;
  font-weight:700;
  text-align:center;
  margin-top:16px;
}

.muted{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

.review{
  background:#eae0ff;
  padding:12px;
  border-radius:16px;
  margin-top:12px;
  opacity:0;
  transform:translateY(6px);
  transition:all 0.3s ease;
}

.review.show{
  opacity:1;
  transform:translateY(0);
}

/* POPUP */
.popup{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.3);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  opacity:0;
  transform:scale(0.8);
  transition:all 0.3s ease;
  pointer-events:none;
}

.popup.show{
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
}

.popup .content{
  background:white;
  padding:24px;
  border-radius:24px;
  text-align:center;
  width:100%;
  max-width:320px;
}

/* checkbox inline */
label.checkbox-inline {
  display: grid;
  grid-template-columns: 1fr 5fr;
  grid-template-rows: 1fr;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  font-size: 14px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div class="burger" id="burgerBtn" onclick="toggleMenu()" style="display:none">☰</div>
    <strong id="title">ProTeam HR</strong>
  </div>

  <div class="menu" id="menu">
    <button onclick="openPage('perf')">Produktivitas</button>
    <button onclick="openPage('vacation')">Kalkulator Cuti</button>
    <button onclick="openPage('weekend')">Kalkulator Akhir Pekan</button>
    <button onclick="openPage('offer')">Kirim Lowongan</button>
    <button onclick="openPage('reviews')">Ulasan</button>
  </div>

  <div class="pages">

    <!-- HOME -->
    <div class="page active" id="home">
      <div class="card show" onclick="openPage('perf')">Produktivitas Peserta Magang</div>
      <div class="card show" onclick="openPage('vacation')">Kalkulator Cuti</div>
      <div class="card show" onclick="openPage('weekend')">Kalkulator Akhir Pekan</div>
      <div class="card show" onclick="openPage('offer')">Kirim Lowongan</div>
      <div class="card show" onclick="openPage('reviews')">Ulasan</div>
    </div>

    <!-- PRODUKTIVITAS -->
    <div class="page" id="perf">
      <button class="primary" onclick="toggleAdd()">Tambah Poin</button>
      <div id="addForm" style="display:none; margin-top:20px;">
        <select id="internSelect"></select>
        <label class="checkbox-inline">
          <input type="checkbox" id="newToggle" onchange="toggleNew()"> Peserta magang baru
        </label>
        <input id="newName" placeholder="Nama peserta magang" style="display:none">
        <div class="row" style="margin-top:12px;">
          <input type="number" id="small" placeholder="Tugas kecil">
          <input type="number" id="big" placeholder="Tugas besar">
        </div>
        <button class="primary" onclick="addPoints()">Simpan</button>
      </div>
      <div id="table" style="margin-top:20px;"></div>
    </div>

    <!-- CUTI -->
    <div class="page" id="vacation">
      <div class="card show">
        <select id="vIntern"></select>
        <input type="number" id="vSalary" placeholder="Gaji per bulan">
        <input type="number" id="vDays" placeholder="Jumlah hari cuti">
        <div class="big" id="vResult">0 IDR</div>
      </div>
    </div>

    <!-- AKHIR PEKAN -->
    <div class="page" id="weekend">
      <div class="card show">
        <select id="wIntern"></select>
        <input type="number" id="wSalary" placeholder="Gaji per bulan">
        <input type="number" id="wHours" placeholder="Jam kerja di akhir pekan">
        <div class="big" id="wResult">0 IDR</div>
      </div>
    </div>

    <!-- LOWONGAN -->
    <div class="page" id="offer">
      <div class="card show">
        <select id="oIntern"></select>
        <select id="position" onchange="updateEmail()">
          <option>Penguji Perangkat Lunak</option>
          <option>Pengembang Backend</option>
          <option>Pengembang Frontend</option>
        </select>
        <div class="muted">Periksa email sebelum mengirim</div>
        <textarea id="emailText"></textarea>
        <button class="primary" onclick="sendOffer()">Kirim Undangan</button>
      </div>
    </div>

    <!-- ULASAN -->
    <div class="page" id="reviews">
      <div class="card show">
        <textarea id="reviewText" placeholder="Tinggalkan ulasan"></textarea>
        <button class="primary" onclick="addReview()">Kirim Ulasan</button>
        <div id="reviewList"></div>
      </div>
    </div>

  </div>

  <div class="popup" id="popup">
    <div class="content" id="popupText"></div>
  </div>

</div>

<script>
let interns={
  Andi:120,
  Budi:95,
  Siti:140,
  Dewi:110,
  Rizky:130,
  Putri:100,
  Agung:90,
  Nabila:105,
  Fajar:125,
  Ayu:98
};

let reviews=[
  "Program magang yang sangat bermanfaat, saya belajar banyak",
  "Mentor profesional dan tim yang sangat ramah",
  "Pendekatan pembelajaran dan tugasnya sangat jelas"
];

function toggleMenu(){menu.style.display=menu.style.display==="flex"?"none":"flex";}
function openPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  menu.style.display="none";
  burgerBtn.style.display = id==="home" ? "none" : "block";
}

function render(){
  table.innerHTML="";
  internSelect.innerHTML="";
  [vIntern,wIntern,oIntern].forEach(s=>s.innerHTML="");
  Object.entries(interns)
    .sort((a,b)=>b[1]-a[1])
    .forEach(([name,points])=>{
      const row=document.createElement("div");
      row.className="table-row";
      row.innerHTML=`<span>${name}</span><strong>${points}</strong>`;
      table.appendChild(row);
      internSelect.add(new Option(name,name));
      vIntern.add(new Option(name,name));
      wIntern.add(new Option(name,name));
      oIntern.add(new Option(name,name));
    });
  renderReviews();
}

function toggleAdd(){
  if(addForm.style.display==="none" || !addForm.style.display){
    addForm.style.display="block";
    setTimeout(()=>addForm.classList.add('show'),50);
  } else{
    addForm.classList.remove('show');
    setTimeout(()=>addForm.style.display="none",400);
  }
}

function toggleNew(){
  const isNew=newToggle.checked;
  internSelect.disabled=isNew;
  newName.style.display=isNew?"block":"none";
}

function addPoints(){
  const name=newToggle.checked?newName.value:internSelect.value;
  if(!name)return;
  interns[name]=(interns[name]||0)+(small.value*10+big.value*15);
  newName.value=small.value=big.value="";
  newToggle.checked=false;
  toggleNew();
  render();
}

[vSalary,vDays].forEach(el=>el.oninput=()=>{
  vResult.innerText=Math.round((vSalary.value/30)*vDays.value)+" IDR";
});

[wSalary,wHours].forEach(el=>el.oninput=()=>{
  wResult.innerText=Math.round(wSalary.value*0.01*wHours.value)+" IDR";
});

function updateEmail(){
  emailText.value=
`Halo ${oIntern.value},

Kami dengan senang hati menawarkan Anda posisi "${position.value}" di tim ProTeam.
Kami menantikan kerja sama Anda bersama kami.`;
}
oIntern.onchange=updateEmail;
updateEmail();

function showPopup(text){
  popupText.innerText=text;
  popup.classList.add('show');
  setTimeout(()=>popup.classList.remove('show'),2400);
}
function sendOffer(){
  showPopup("Peserta magang telah menerima undangan kerja Anda.");
}

function renderReviews(){
  reviewList.innerHTML="";
  reviews.forEach(r=>{
    const div=document.createElement("div");
    div.className="review";
    div.innerText=r;
    reviewList.appendChild(div);
    setTimeout(()=>div.classList.add('show'),50);
  });
}
function addReview(){
  if(!reviewText.value)return;
  reviews.push(reviewText.value);
  reviewText.value="";
  renderReviews();
}

render();
</script>
</body>
</html>

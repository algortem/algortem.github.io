<!DOCTYPE html>
<html lang='id'>
<head>
<meta charset='UTF-8' />
<title>Aplikasi Perjalanan</title>
<meta name='viewport' content='width=device-width, initial-scale=1.0' />

<style>
:root {
  --bg: #f5f7fa;
  --card: #ffffff;
  --primary: #2a7cff;
  --muted: #6b7280;
  --border: #e5e7eb;
  --radius: 16px;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* App */
.app {
  height: 80vh;
  aspect-ratio: 430 / 932;
  background: var(--card);
  border-radius: 28px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.12);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Header */
.header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h1 {
  font-size: 18px;
  margin: 0;
}

.miles {
  font-size: 14px;
  color: var(--primary);
  font-weight: 600;
}

/* Pages */
.pages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.page { display: none; }
.page.active { display: block; }

/* Cards */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  border: 1px solid var(--border);
  margin-bottom: 16px;
}

/* Inputs */
input, select, textarea {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  margin-top: 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  font-size: 14px;
}

input:nth-child(1), select:nth-child(1) {
    margin-top: 0;
}

textarea {
  height: auto;
  min-height: 120px;
  padding: 12px;
}

/* Buttons */
button {
  width: 100%;
  height: 44px;
  margin-top: 16px;
  border-radius: 12px;
  border: none;
  background: var(--primary);
  color: white;
  font-size: 14px;
  cursor: pointer;
}

/* Text helpers */
.hint {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.4;
}

.price {
  margin-top: 12px;
  font-weight: 600;
}

/* Nav */
.nav {
  border-top: 1px solid var(--border);
  display: flex;
  background: white;
}

.nav button {
  flex: 1;
  background: none;
  border: none;
  height: 52px;
  margin-top: 0;
  font-size: 20px;
}

.nav button.active {
  color: var(--primary);
}

/* Popup */
.popup {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.popup .content {
  background: white;
  padding: 24px;
  border-radius: 18px;
  text-align: center;
  max-width: 320px;
  width: 100%;
  line-height: 1.4;
}
</style>
</head>

<body>

<div class='app'>
  <div class='header'>
    <h1 id='title'>Paket Wisata</h1>
    <div class='miles'>✈️ Miles: <span id='milesCount'>78</span></div>
  </div>

  <div class='pages'>

    <!-- PAKET -->
    <div class='page active' id='ticket'>
      <div class='card'>
        <input placeholder='Nama' id='tName'>
        <select id='tCountry'></select>
        <select id='tSeason'>
          <option>Musim Panas</option>
          <option>Musim Gugur</option>
          <option>Musim Dingin</option>
          <option>Musim Semi</option>
        </select>
        <button onclick='sendTicket()'>Kirim permohonan</button>
      </div>
    </div>

    <!-- PENERBANGAN -->
    <div class='page' id='flight'>
      <div class='card'>
        <select id='fCountry'></select>
        <input type='date' id='fDate'>
        <div class='price' id='flightPrice'>Harga: —</div>
        <button onclick='showMilesBlock()'>Bayar</button>
      </div>

      <div class='card' id='milesBlock' style='display:none'>
        <div class='hint'>
          Anda dapat menggunakan miles (tersedia: <span id='availableMiles'>78</span>)
        </div>
        <input type='number' id='useMiles' placeholder='Masukkan jumlah miles'>
        <button onclick='buyTicket()'>Beli tiket</button>
      </div>
    </div>

    <!-- HOTEL -->
    <div class='page' id='hotel'>
      <div class='card'>
        <select id='hCountry'></select>
        <select id='hHotel'>
          <option value='120'>Sky Hotel — 120 🪙 / malam</option>
          <option value='80'>City Inn — 80 🪙 / malam</option>
          <option value='200'>Luxury Stay — 200 🪙 / malam</option>
        </select>
        <input type='number' placeholder='Jumlah malam' id='hNights'>
        <div class='price' id='hotelPrice'>Total biaya: —</div>
        <button onclick='bookHotel()'>Pesan</button>
      </div>
    </div>

    <!-- ADMIN -->
    <div class='page' id='admin'>
      <div class='card' id='adminLogin'>
        <input type='password' placeholder='Kata sandi'>
        <button onclick='loginAdmin()'>Masuk</button>
      </div>

      <div class='card' id='adminPanel' style='display:none'>
        <input placeholder='Nama klien' id='aName'>
        <input type='number' placeholder='Jumlah perjalanan' id='aCount'>
        <select id='aCountry'></select>
        <button onclick='generateEmail()'>Selesai</button>

        <div class='hint' id='emailHint' style='display:none'>
          Periksa teks email
        </div>
        <textarea id='emailText' style='display:none'></textarea>
        <button id='sendEmailBtn' style='display:none' onclick='sendEmail()'>
          Kirim
        </button>
      </div>
    </div>

  </div>

  <div class='nav'>
    <button class='active' onclick='switchPage("ticket", this)'>🎫</button>
    <button onclick='switchPage("flight", this)'>✈️</button>
    <button onclick='switchPage("hotel", this)'>🏨</button>
    <button onclick='switchPage("admin", this)'>⚙️</button>
  </div>

  <div class='popup' id='popup'>
    <div class='content' id='popupText'></div>
  </div>
</div>

<script>
let miles = 78;

const countries = [
  'Jerman','Prancis','Italia','Spanyol','Inggris',
  'Belanda','Polandia','Swiss',
  'Thailand','Vietnam','Indonesia','Malaysia','Singapura',
  'Jepang','Korea Selatan'
];

['tCountry','fCountry','hCountry','aCountry'].forEach(id => {
  const s = document.getElementById(id);
  countries.forEach(c => {
    const o = document.createElement('option');
    o.textContent = c;
    s.appendChild(o);
  });
});

function switchPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  title.innerText = {
    ticket:'Paket Wisata',
    flight:'Penerbangan',
    hotel:'Hotel',
    admin:'Admin'
  }[id];
}

function showPopup(text) {
  popupText.innerText = text;
  popup.style.display = 'flex';
  setTimeout(() => popup.style.display = 'none', 2400);
}

function sendTicket() {
  showPopup(`Permohonan ${tName.value} – ${tCountry.value} – ${tSeason.value} telah dikirim!
Kami akan segera menghubungi Anda`);
}

fDate.onchange = () => {
  const d = new Date(fDate.value).getDay();
  flightPrice.innerText = `Harga: ${150 + ((d === 5 || d === 6) ? 70 : 0)} 🪙`;
};

function showMilesBlock() {
  milesBlock.style.display = 'block';
  availableMiles.innerText = miles;
}

function buyTicket() {
  const used = Number(useMiles.value);
  if (used > 0 && used <= miles) {
    miles -= used;
    milesCount.innerText = availableMiles.innerText = miles;
    showPopup('Tiket berhasil dibeli dan akan segera dikirim ke email Anda');
  }
}

hNights.oninput = () => {
  hotelPrice.innerText = `Total biaya: ${(hHotel.value * hNights.value) || 0} 🪙`;
};

function bookHotel() {
  showPopup('Pemesanan berhasil, terima kasih!');
}

function loginAdmin() {
  if (adminLogin.querySelector('input').value === 'admin') {
    adminLogin.style.display = 'none';
    adminPanel.style.display = 'block';
  }
}

function generateEmail() {
  emailHint.style.display = emailText.style.display = sendEmailBtn.style.display = 'block';
  emailText.value =
`Halo, ${aName.value}!
Anda telah bepergian bersama kami sebanyak ${aCount.value} kali. Mau lagi?
Kami sedang mengadakan promo — perjalanan ke ${aCountry.value} dengan diskon hingga 50%!`;
}

function sendEmail() {
  showPopup('Terkirim ke klien');
}
</script>

</body>
</html>

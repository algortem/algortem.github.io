<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>SweetStore</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#fafafa;
  --line:#e6e6e6;
  --text:#111;
  --muted:#666;
  --accent:#ffb000;
  --accent-dark:#e09a00;
}

*{
  box-sizing:border-box;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

body{
  margin:0;
  background:#ddd;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  height:80vh;
  aspect-ratio:430/932;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  border:1px solid #ccc;
  position:relative;
}

.header{
  padding:14px 16px;
  font-weight:600;
  font-size:15px;
  border-bottom:1px solid var(--line);
}

.content{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

.page{display:none;}
.page.active{display:block;}

input, select{
  width:100%;
  padding:10px;
  font-size:14px;
  border:1px solid var(--line);
  background:#fff;
}

input:focus, select:focus{
  border-color:var(--accent);
}

input.error{
  border-color:red;
}

button{
  width:100%;
  padding:10px;
  font-size:14px;
  font-weight:600;
  background:var(--accent);
  border:none;
  color:#000;
  cursor:pointer;
}

button.secondary{
  background:#fff;
  border:1px solid var(--line);
}

button:hover{
  background:var(--accent-dark);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.product{
  border:1px solid var(--line);
  cursor:pointer;
}

.product img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.product-info{
  padding:8px;
  border-top:1px solid var(--line);
}

.product-name{
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.product-price{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

.old-price{
  text-decoration: line-through;
  color: var(--muted);
  margin-right:6px;
  font-size:12px;
}

.footer{
  display:flex;
  border-top:1px solid var(--line);
}

.footer button{
  flex:1;
  border-right:1px solid var(--line);
}

.footer button:last-child{
  border-right:none;
}

.popup{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.popup-box{
  background:#fff;
  padding:20px;
  border:1px solid var(--line);
  width:80%;
  text-align:center;
  font-size:14px;
}

.hint{
  font-size:12px;
  color:var(--muted);
  margin-top:6px;
}
</style>
</head>

<body>
<div class="app">

  <div class="header">SweetStore</div>

  <div class="content">

    <!-- LOGIN -->
    <div class="page active" id="loginPage">
      <input id="login" placeholder="Nama Pengguna">
      <input id="password" type="password" placeholder="Kata Sandi" style="margin-top:10px">
      <button style="margin-top:14px" onclick="login1()">Masuk</button>
      <div id="loginError" class="hint" style="color:red;display:none">
        Nama pengguna atau kata sandi salah
      </div>
    </div>

    <!-- KATALOG -->
    <div class="page" id="catalogPage">
      <input id="search" placeholder="Cari">
      <div id="popular" class="hint" style="display:none">
        Ini adalah pencarian paling populer!
      </div>

      <button class="secondary" onclick="toggleFilters()">Filter</button>

      <div id="filters" style="display:none;margin-top:10px">
        <select id="category">
          <option value="">Semua Kategori</option>
          <option>bebas-gula</option>
          <option>bebas-lemak</option>
          <option>bebas-gluten</option>
        </select>
        <input id="min" type="number" placeholder="Harga Min" style="margin-top:6px">
        <input id="max" type="number" placeholder="Harga Max" style="margin-top:6px">
        <button style="margin-top:6px" onclick="applyFilters()">Terapkan</button>
      </div>

      <div class="grid" id="products" style="margin-top:16px"></div>
    </div>

    <!-- PRODUK -->
    <div class="page" id="productPage">
      <img id="pImg" style="width:100%;aspect-ratio:1/1;object-fit:cover">
      <div style="margin-top:10px;font-weight:600" id="pName"></div>
      <div class="hint" id="pPrice"></div>
      <div class="hint" id="pDesc"></div>
      <button onclick="addToCart()">Tambah ke Keranjang</button>
    </div>

    <!-- KERANJANG -->
    <div class="page" id="cartPage">
      <div id="cartList"></div>

      <input id="promoInput" placeholder="Kode Promo" style="margin-top:12px">
      <button class="secondary" onclick="applyPromo()">Terapkan Kode Promo</button>

      <div style="margin-top:14px;font-weight:600">
        Total: <span id="total">0 IDR</span>
      </div>
      <button style="margin-top:10px" onclick="order()">Pesan</button>
    </div>

  </div>

  <div class="footer" id="footer" style="display:none">
    <button onclick="show('catalogPage')">Katalog</button>
    <button onclick="openCart()">Keranjang</button>
  </div>

  <div class="popup" id="popup">
    <div class="popup-box" id="popupText"></div>
  </div>

</div>

<script>
// ====== PRODUK ======
let img = (name) => `../images/${name}`
const products=[
 {name:"Kue Coklat",price:350,tags:"bebas-gula",desc:"Coklat",img:img("Chocolate_cake.png")},
 {name:"Muffin Vanila",price:120,tags:"bebas-lemak",desc:"Vanila",img:img("Vanilla_muffin.png")},
 {name:"Kue Wortel",price:300,tags:"bebas-gluten",desc:"Wortel",img:img("Carrot_cake.png")},
 {name:"Brownie",price:260,tags:"bebas-gula",desc:"Brownie",img:img("Brownie.png")},
 {name:"Cheesecake",price:400,tags:["bebas-gluten"],desc:"Cheesecake",img:img("Cheesecake.png")},
 {name:"Lemon Tart",price:180,tags:["bebas-lemak"],desc:"Lemon tart",img:img("Lemon_tart.png")},
 {name:"Macaron",price:90,tags:["bebas-gula"],desc:"Macaron",img:img("Macaron.png")},
 {name:"Pai Apel",price:210,tags:["bebas-gluten"],desc:"Pai apel",img:img("Apple_pie.png")},
 {name:"Donat",price:150,tags:["bebas-lemak"],desc:"Donat",img:img("Donut.png")},
 {name:"Cupcake",price:130,tags:["bebas-gula"],desc:"Cupcake",img:img("Cupcake.png")}
];

// ====== ELEMEN ======
const loginInput=document.getElementById("login");
const password=document.getElementById("password");
const loginError=document.getElementById("loginError");
const productsDiv=document.getElementById("products");
const popupDiv=document.getElementById("popup");
const popupText=document.getElementById("popupText");
const search=document.getElementById("search");
const category=document.getElementById("category");
const min=document.getElementById("min");
const max=document.getElementById("max");
const promoInput=document.getElementById("promoInput");
const total=document.getElementById("total");
const filters=document.getElementById("filters");

let cart=[];
let current=null;
let discount=0;

// ====== LOGIN ======
function login1(){
  if(login.value==="kate.smith" && password.value==="sweetstore1111"){
    footer.style.display="flex";
    show("catalogPage");
    render(products);
    popup("Untuk pelanggan baru diskon 40% untuk seluruh katalog<br><br>Kode promo: <b>NEW</b>");
  }else{
    loginError.style.display="block";
    login.classList.add("error");
    password.classList.add("error");
  }
}

function popup(t){
  popupText.innerHTML=t;
  popupDiv.style.display="flex";
  setTimeout(()=>popupDiv.style.display="none",1800);
}

// ====== TAMPILKAN HALAMAN ======
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ====== RENDER KATALOG ======
function render(list){
  productsDiv.innerHTML="";
  list.forEach(p=>{
    const d=document.createElement("div");
    d.className="product";
    d.innerHTML=`
      <img src="${p.img}">
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-price">${p.price} IDR</div>
      </div>`;
    d.onclick=()=>open(p);
    productsDiv.appendChild(d);
  });
}

// ====== BUKA PRODUK ======
function open(p){
  current=p;
  show("productPage");
  pImg.src=p.img;
  pName.innerText=p.name;
  pPrice.innerText=p.price+" IDR";
  pDesc.innerText=p.desc;
}

// ====== TAMBAH KE KERANJANG ======
function addToCart(){
  cart.push(current);
  popup("Produk ditambahkan ke keranjang");
}

// ====== KERANJANG ======
function openCart(){
  show("cartPage");
  renderCart();
}

function renderCart(){
  cartList.innerHTML="";
  let sum=0;
  cart.forEach(p=>{
    sum+=p.price;

    let row=document.createElement("div");
    row.style.marginBottom="6px";

    if(discount>0){
      const newPrice=Math.round(p.price*(1-discount));
      row.innerHTML=`
        ${p.name} —
        <span class="old-price">${p.price} IDR</span>
        <span>${newPrice} IDR</span>
      `;
    }else{
      row.innerHTML=`${p.name} — ${p.price} IDR`;
    }
    cartList.appendChild(row);
  });

  if(discount>0){
    const discounted=Math.round(sum*(1-discount));
    total.innerHTML=`
      <div class="old-price">${sum} IDR</div>
      <div>${discounted} IDR</div>
    `;
  }else{
    total.innerText=sum+" IDR";
  }
}

// ====== PROMO ======
function applyPromo(){
  if(promoInput.value.trim().toUpperCase()==="NEW" && discount===0){
    discount=0.4;
    renderCart();
    popup("Kode promo diterapkan");
  }
}

// ====== PESAN ======
function order(){
  cart=[];
  discount=0;
  promoInput.value="";
  renderCart();
  popup("Pesanan berhasil dibuat");
}

// ====== FILTER ======
function toggleFilters(){
  filters.style.display = filters.style.display==="none"?"block":"none";
}

function applyFilters(){
  const cat=category.value;
  const minv=+min.value||0;
  const maxv=+max.value||99999;
  render(products.filter(p=>{
    const priceOk=p.price>=minv && p.price<=maxv;
    const catOk=!cat || p.tags.includes(cat);
    const searchOk=search.value.trim()==="" || p.name.toLowerCase().includes(search.value.toLowerCase());
    return priceOk && catOk && searchOk;
  }));
}

// ====== CARI ======
search.oninput=e=>{
  popular.style.display=e.target.value.toLowerCase()==="kue coklat"?"block":"none";
  applyFilters();
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
overflow: hidden;
    font-family: "SUSE Mono", sans-serif;
    margin: 0;
    padding: 0;
    width: 100vw; height: 100vh;
    user-select: none;
        }
        .page12 {
            width: 100%;
            height: 100%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 988;
    overflow: scroll;
    flex-shrink: 0;
}

.page12 .cert {
    height: 1527px;
    width: 1080px;
    outline: 8px solid black;
    padding: 40px;
    position: relative;
    background: white;
    font-family: 'Montserrat', sans-serif;
    cursor: pointer;
    -webkit-box-shadow: none;
    -moz-box-shadow: none;
    box-shadow: none;
    transition: box-shadow .1s linear;
    flex-shrink: 0;
    /* overflow: hidden; */
    box-sizing: border-box;
}

.page12 .cert-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
}

.page12 .cert:hover {
    -webkit-box-shadow: 4px 4px 22px -1px rgba(34, 60, 80, 0.61);
    -moz-box-shadow: 4px 4px 22px -1px rgba(34, 60, 80, 0.61);
    box-shadow: 4px 4px 22px -1px rgba(34, 60, 80, 0.61);
    transition: box-shadow .1s linear;
}

.page12 .cert:active {
    -webkit-box-shadow: none;
    -moz-box-shadow: none;
    box-shadow: none;
    transition: box-shadow .1s linear;
}

.page12 .cert .field {
    width: 350px;
    height: 350px;
    gap: 0;
    border: none;
    position: absolute;
    pointer-events: none;
}

.page12 .cert .h1 {
    position: absolute;
    width: 600px;
    height: 350px;
    top: 40px;
    right: 40px;
    text-align: left;
    font-size: 60px;
    font-weight: bold;
    display: flex;
    align-items: center;
    box-sizing: border-box;
}

.page12 .cert .student-name {
    position: absolute;
    width: 1000px;
    text-align: center;
    top: 500px;
    font-size: 100px;
    font-weight: 800;
}

.page12 .sprite {
    position: absolute;
    bottom: 0;
    right: 40px;
    width: 350px;
}

.page12 .sprite img {
    width: 350px;
    display: block;
}

.page12 .info {
    position: absolute;
    bottom: 150px;
    width: 630px;
    font-size: 40px;
    gap: 20px;
    display: flex;
    flex-direction: column;
}

.page12 .info .head {
    font-weight: 700;
    margin-bottom: 20px;
    font-size: 50px;
}

.page12 .info .head-i {
    font-weight: 450;
    gap: 20px;
    display: flex;
    align-items: center;
}

.page12 .info .head-i img {
    width: 70px;
    flex-grow: 0;
    flex-shrink: 0;
}

.k {
    position: absolute;
    top: 50px;
    left: 50px;
    width: 300px;
    height: 300px;
    opacity: 1 !important;
    background: url(unnamed.png);
    background-size: cover;
    background-position: center;
    z-index: 10000;
}

    </style>
</head>
<body>
    <div class="page page12">
        <div class="cert">
            <div class="k"></div>
            <img class="cert-bg" src="cert-bg.png" alt="">
            <div class="sprite"><img src="sprite.png" alt=""></div>
            <div class="h1"><p>Scratch developer licence</div>
            <div class="student-name"></div>
            <div class="info">
                <div class="head">After completing my first project, I can and I will:</div>
                <div class="head-i"><div class="pic"><img src="mouse.png" alt=""></div><div class="text">Create super-cool games</div></div>
                <div class="head-i"><div class="pic"><img src="virus.png" alt=""></div><div class="text">Impress all my friends</div></div>
                <div class="head-i"><div class="pic"><img src="lock.png" alt=""></div><div class="text">Be the best programmer</div></div>
                <div class="head-i"><div class="pic"><img src="art.png" alt=""></div><div class="text">Keep learning new things</div></div>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
    <script>
        let student_name = prompt("Student's name")
        document.querySelector('.student-name').innerHTML = student_name

				let cert = document.querySelector('.page12 .cert')
				// let copy = cert.cloneNode(true)
				// copy.classList.add('toDownload')
				// copy.style.position = 'absolute'
				// copy.style.top = '10000px'
				// pages[current_page].appendChild(copy)
				cert.style.transform = `scale(${getScale()})`

function getScale() {
	let certStyles = getComputedStyle(document.querySelector('.cert'))
	let toScale = 0.9 * window.innerHeight / parseInt(certStyles.height)
	return toScale
}
        function download_cert() {
            document.querySelector('.cert').style.transform = `none`
            domtoimage.toPng(document.querySelector('.cert'), {quality: 1})
            .then(function (dataUrl) {
                var img = new Image()
                img.src = dataUrl
                let link = document.createElement('a')
                link.download = 'Squad Leader Cerrificate.png'
                link.href = dataUrl
                link.click()
                document.querySelector('.cert').style.transform = `scale(${getScale()})`
            })
            .catch(function (error) {
                console.error('oops, something went wrong!', error);
            })
            document.querySelector('.cert').removeEventListener('click', download_cert)
            
        }
        document.querySelector('.cert').addEventListener('click', download_cert)
        </script>
</body>
</html>
